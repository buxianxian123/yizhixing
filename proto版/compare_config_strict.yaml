# 国内/国际天气数据一致性比对规则配置 — 严格相等版
# 所有字段必须完全一致（diff==0）才算"一致"
# 天气现象：精确中文文字比对（无语义映射）
# 降水量：数值精确比对（无等级映射）
# 运行: CONFIG_PATH=compare_config_strict.yaml python3 reformat_threshold.py
# 或:  gen_report_from_raw.py / scheduled_compare.py 同理

# ===== 一致判定阈值（全部为0 = 严格相等）=====
thresholds:
  温度: 0          # ℃
  体感温度: 0      # ℃
  湿度: 0          # %
  风速: 0          # m/s (海外已÷3.6换算)
  气压: 0          # hPa
  降水量: 0        # mm
  AQI: 0
  # PM2.5 不比较

# ===== 天气现象语义映射（清空 = 回退到精确文字比对）=====
weather_mapping:
  score_same_cat_same_level: 5
  score_same_cat_level_diff_1: 4
  score_diff_cat_no_hi: 3
  score_same_cat_level_diff_ge2: 2
  score_diff_cat_precip: 2
  score_hi_same_cat: 1
  score_hi_diff_cat: 0
  ok_min_score: 5
  texts: {}        # 空字典 → 代码自动走精确文字比对

# ===== 风速换算 =====
wind_convert:
  enabled: true
  divisor: 3.6

# ===== 字段映射 =====
modules:
  实况:
    source: current
    multi: false
    ts_label: 实况
    fields:
      温度: {cn: temp, intl: temp, type: numeric}
      体感温度: {cn: real_feel, intl: rf, type: numeric}
      湿度: {cn: humidity, intl: rh, type: numeric}
      风速: {cn: wspd, intl: wspd, type: wind}
      气压: {cn: mslp, intl: sp, type: numeric}
      天气现象: {cn: weather, intl: wtr, type: weather}
      降水量: {cn: precip_1h, intl: precip, type: numeric}

  24小时:
    source: hourly
    multi: true
    limit: 24
    ts_key: predict_time
    fields:
      温度: {cn: temp, intl: temp, type: numeric}
      体感温度: {cn: real_feel, intl: rf, type: numeric}
      湿度: {cn: humidity, intl: rh, type: numeric}
      风速: {cn: wspd, intl: wspd, type: wind}
      气压: {cn: mslp, intl: sp, type: numeric}
      天气现象: {cn: weather, intl: wtr, type: weather}

  15天:
    source: daily
    multi: true
    limit: 16
    ts_key: predict_date
    fields:
      温度(最高): {cn: temp_high, intl: temph, type: numeric}
      温度(最低): {cn: temp_low, intl: templ, type: numeric}
      体感温度(白天): {cn: realfeel_d, intl: rfd, type: numeric}
      体感温度(夜间): {cn: realfeel_n, intl: rfn, type: numeric}
      湿度: {cn: humidity, intl: rh, type: numeric}
      风速(白天): {cn: wspd_day, intl: wspdd, type: wind}
      风速(夜间): {cn: wspd_night, intl: wspdn, type: wind}
      气压: {cn: mslp, intl: spd, type: numeric, note: 海外取白天spd}
      天气现象(白天): {cn: weather_day, intl: wtrd, type: weather}
      天气现象(夜间): {cn: weather_night, intl: wtrn, type: weather}

  AQI模块:
    source: aqi
    multi: false
    ts_label: AQI实况
    fields:
      AQI: {cn: aqi, intl: AQI, type: numeric}

# ===== 定时均值比对 =====
schedule:
  interval_seconds: 3600
  avg_count: 48
  keep_raw: true
